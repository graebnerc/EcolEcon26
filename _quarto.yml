project:
  type: "website"
  title: "Ecological Economics (Winter 2026/27)"
  output-dir: _site
  render: # Add here all folders that should be rendered
    - "index.qmd"
    - "content/index.qmd"
    - "content/material/*.qmd"
    - "content/material/session*/*.qmd"
    # revealjs decks: they have to be rendered INTO _site, or the iframe that
    # embeds them on a session page has nothing to point at.
    - "content/material/slides/*.qmd"

website:
  title: "Ecological Economics" # Title of website shown on top left
  page-navigation: true
  reader-mode: true
  open-graph: true
  favicon: "figures/icons/course_favicon.png"
  search:
    location: navbar
    type: textbox
  sidebar:
    style: docked
    contents:
      - href: index.qmd
        text: "🏠 Home"
      - href: content/index.qmd
        text: "🏢 Getting Started"
      - section: "🗓️ Material"
        contents:
          - href: content/material/SeminarDescription.qmd
            text: "Seminar Description & schedule"
          - href: content/material/examination.qmd
            text: "Examination (poster)"
          - section: "Session 1 (16.09.): Introduction & theory"
            contents:
              - href: content/material/s_01a_Introduction.qmd
                text: "Introduction, logistics & example poster"
              - href: content/material/s_01b_Theories.qmd
                text: "Theories of development and the environment"
          - href: content/material/s_02_DecentralizedWeek.qmd
            text: "Session 2 (23.09.): No on-site class"
          - section: "Session 3 (30.09.): Text discussion & data"
            contents:
              - href: content/material/s_03a_TextDiscussion.qmd
                text: "Discussion of the entry texts"
              - href: content/material/s_03b_WorkingWithData.qmd
                text: "Working with data"
          - section: "Session 4 (07.10.): Argumentation & posters"
            contents:
              - href: content/material/s_04a_ScientificArgumentation.qmd
                text: "Primer on scientific argumentation"
              - href: content/material/s_04b_PosterDesign.qmd
                text: "Primer on poster design and presentation"
          - href: content/material/s_05_Trade.qmd
            text: "Session 5 (21.10.): Trade & environmental conflicts"
          - href: content/material/s_06_Accounting.qmd
            text: "Session 6 (28.10.): Accounting environmental stressors"
          - section: "Session 7 (04.11.): Policy instruments & EU ETS"
            contents:
              - href: content/material/s_07a_PolicyInstruments.qmd
                text: "Classical environmental policy instruments"
              - href: content/material/s_07b_ETS.qmd
                text: "Application: the EU ETS"
          - href: content/material/s_08_Degrowth.qmd
            text: "Session 8 (11.11.): Growth vs. degrowth"
          - href: content/material/s_09_Justice.qmd
            text: "Session 9 (18.11.): Environmental & global justice"
          - href: content/material/s_10_HeatTransition.qmd
            text: "Session 10 (25.11.): The heat transition in Germany: A Case Study"
          - href: content/material/s_11_CountryAnalysis.qmd
            text: "Session 11 (02.12.): Country analysis presentations"
          - href: content/material/s_12_Summary.qmd
            text: "Session 12 (09.12.): Summary & open questions"
          - href: content/material/s_13_Posters.qmd
            text: "Session 13 (16.12.): Poster presentations"

  navbar:
    background: primary
  page-footer:
    background: light
    left: "Copyright 2026, Claudius Gräbner-Radkowitsch"

bibliography: references/references.bib
csl: references/jepp.csl

format:
  html:
    author-meta: Claudius Gräbner-Radkowitsch
    author:
      name: Claudius Gräbner-Radkowitsch
      url: https://claudius-graebner.com/
      orcid: 0000-0003-4065-4722
      affiliation: EUF and JKU
      affiliation-url: https://www.uni-flensburg.de/en/pluralist-economics
    date-format: "DD MM YYYY"

    email-obfuscation: javascript
    link-external-newwindow: true
    link-external-icon: false
    code-fold: true
    code-tools: true
    code-copy: true
    highlight-style: github

    theme:
      light:
        - cosmo
        - assets/styles/custom.scss # Change the default colour
    toc: true

execute:
  freeze: auto
